<html lang="en">
<head>

<meta name="robots" content="noindex, nofollow" />
<title>Find Your Seat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&family=Unbounded:wght@500;700;800&family=Bebas+Neue&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #150B24;
    --card: #FDFBF7;
    --ink: #2A1F35;
    --ink-soft: #8A7F91;
    --line: #E7DEE9;
    --accent: #C2318F;
    --accent-dark: #9E1F70;
    --accent-darker: #7E1959;
    --gold: #D4A657;
    --danger: #B15C4C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    position: relative;
    background:
      radial-gradient(600px circle at 12% 8%, rgba(255,72,180,0.35), transparent 60%),
      radial-gradient(500px circle at 88% 10%, rgba(255,196,64,0.26), transparent 60%),
      radial-gradient(650px circle at 50% 96%, rgba(64,200,255,0.20), transparent 60%),
      radial-gradient(550px circle at 92% 78%, rgba(168,64,255,0.30), transparent 60%),
      radial-gradient(480px circle at 6% 82%, rgba(255,72,180,0.22), transparent 60%),
      var(--bg-deep);
    font-family: 'Work Sans', sans-serif;
    color: var(--ink);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 150px 18px 56px;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.8;
    background-repeat: repeat;
    background-size: 260px 260px;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, rgba(255,255,255,0.9), transparent),
      radial-gradient(1.5px 1.5px at 80% 15%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 45% 60%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1.5px 1.5px at 65% 80%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 25% 75%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1.5px 1.5px at 90% 55%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 55% 30%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 35% 90%, rgba(255,255,255,0.5), transparent);
  }
  .disco-glow {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 900px;
    height: 900px;
    transform: translate(-50%, -50%);
    background: conic-gradient(from 0deg, rgba(255,72,180,0.16), rgba(255,196,64,0.12), rgba(64,200,255,0.12), rgba(168,64,255,0.16), rgba(255,72,180,0.16));
    filter: blur(90px);
    animation: discoSpin 30s linear infinite;
    z-index: 0;
    pointer-events: none;
  }
  @keyframes discoSpin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  /* Extra lights */
  .sparkles { position: fixed; top: 0; left: 0; width: 2px; height: 2px; border-radius: 50%; pointer-events: none; z-index: 0; }

  .sparkles.mix { box-shadow: 90.2vw 77.7vh 2.3px 0.5px #FF7AC8,43.5vw 63.3vh 0.3px 0.9px #C79BFF,46.4vw 73.8vh 0.3px 0.2px #FF7AC8,3.7vw 58.9vh 1.4px 0.7px #FFFFFF,82.0vw 97.1vh 2.0px 0.4px #FFFFFF,54.7vw 3.1vh 2.4px 0.7px #FFFFFF,52.6vw 92.5vh 1.3px 0.9px #FF7AC8,3.7vw 21.9vh 1.5px 0.8px #7AD8FF,26.4vw 42.1vh 0.4px 0.9px #7AD8FF,89.0vw 65.9vh 2.4px 0.5px #FFFFFF,13.8vw 15.9vh 1.5px 0.9px #FF7AC8,60.6vw 77.1vh 0.4px 0.1px #FFFFFF,72.1vw 55.5vh 1.0px 0.5px #FFFFFF,48.3vw 77.1vh 2.6px 0.1px #FF7AC8,28.1vw 76.7vh 1.5px 0.6px #FFFFFF,44.4vw 61.0vh 1.5px 0.5px #7AD8FF,45.3vw 53.3vh 1.4px 0.9px #FFFFFF,86.9vw 93.3vh 0.8px 0.6px #FF7AC8,83.3vw 14.4vh 0.4px 0.4px #FFFFFF,66.8vw 43.0vh 0.6px 0.3px #FFFFFF,88.9vw 16.1vh 2.1px 0.7px #FF7AC8,25.8vw 14.5vh 1.4px 0.7px #FFFFFF,40.0vw 48.8vh 3.0px 0.8px #FF7AC8,70.2vw 98.4vh 1.2px 0.4px #7AD8FF,32.2vw 71.8vh 0.1px 0.6px #C79BFF,69.9vw 38.7vh 1.6px 0.3px #FFFFFF,12.1vw 91.0vh 0.7px 0.9px #FFFFFF,27.0vw 4.9vh 2.3px 0.3px #FF7AC8,81.3vw 84.3vh 2.0px 0.9px #C79BFF,15.6vw 91.1vh 1.7px 0.7px #FFFFFF,28.3vw 79.4vh 0.6px 0.9px #7AD8FF,93.0vw 63.2vh 2.4px 0.1px #FF7AC8,7.5vw 85.6vh 1.4px 0.3px #FFFFFF,41.9vw 90.7vh 1.9px 0.0px #FF7AC8,92.9vw 96.0vh 0.8px 0.2px #7AD8FF,62.6vw 53.0vh 0.6px 0.4px #FF7AC8,27.5vw 79.8vh 3.0px 0.0px #FFFFFF,72.8vw 55.0vh 0.6px 0.5px #C79BFF,11.4vw 81.3vh 1.3px 0.5px #C79BFF,96.1vw 31.2vh 0.6px 0.2px #FF7AC8,82.6vw 70.3vh 1.9px 0.4px #7AD8FF,97.2vw 83.0vh 0.0px 0.6px #7AD8FF,43.2vw 6.4vh 2.0px 0.4px #FFFFFF,66.7vw 28.6vh 0.7px 0.3px #C79BFF,19.2vw 27.4vh 0.0px 0.4px #7AD8FF,96.3vw 54.6vh 0.7px 1.0px #7AD8FF; animation: twinkle 2.7s ease-in-out -1.4s infinite alternate; }
  .sparkles.glow { width: 1px; height: 1px; box-shadow: 23.5vw 20.8vh 23px 6px rgba(255,200,90,0.26),64.7vw 26.8vh 30px 6px rgba(255,200,90,0.35),16.5vw 58.0vh 24px 7px rgba(255,200,90,0.32),10.9vw 92.1vh 32px 6px rgba(255,200,90,0.36),76.7vw 58.9vh 30px 9px rgba(255,200,90,0.30),29.7vw 60.9vh 20px 10px rgba(255,200,90,0.33),51.2vw 43.5vh 29px 8px rgba(255,200,90,0.37),73.8vw 56.3vh 31px 5px rgba(255,200,90,0.33),78.0vw 69.4vh 33px 9px rgba(255,200,90,0.23),6.9vw 62.6vh 33px 7px rgba(255,200,90,0.29),7.8vw 5.7vh 27px 6px rgba(255,200,90,0.26); animation: glowPulse 7s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: 0.2; } to { opacity: 1; } }
  @keyframes glowPulse { from { opacity: 0.45; } to { opacity: 1; } }

  /* Chandeliers */
  .chandeliers { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: min(100vw, 400px); height: auto; overflow: visible; pointer-events: none; z-index: 1; }
  .chGlow { animation: bulbPulse 3.2s ease-in-out infinite alternate; }
  .chStar { transform-box: fill-box; transform-origin: center; animation: starTwinkle 2.4s ease-in-out infinite alternate; }
  @keyframes bulbPulse { from { opacity: 0.55; } to { opacity: 1; } }
  @keyframes starTwinkle { from { opacity: 0.15; transform: scale(0.6); } to { opacity: 1; transform: scale(1.15); } }
  /* Dangling string lights on the sides */
  .side-lights { position: absolute; top: 0; width: 38px; height: 520px; overflow: visible; pointer-events: none; z-index: 0; }
  .side-lights.l { left: max(0px, calc(50% - 258px)); }
  .side-lights.r { right: max(0px, calc(50% - 258px)); }
  .lbA { animation: lightPulse 2.6s ease-in-out infinite alternate; }
  .lbB { animation: lightPulse 3.4s ease-in-out -1.2s infinite alternate; }
  @keyframes lightPulse { from { opacity: 0.35; } to { opacity: 1; } }

  /* Gold lights rising from the bottom */
  .floor-glow { position: fixed; left: 0; right: 0; bottom: 0; height: 30vh; pointer-events: none; z-index: 0;
    background: linear-gradient(to top, rgba(255,196,80,0.30), rgba(255,196,80,0.10) 45%, transparent); }
  .footlights { position: fixed; left: 0; bottom: 7px; width: 2px; height: 2px; border-radius: 50%; pointer-events: none; z-index: 0;
    box-shadow: 3.0vw 0 7px 2px rgba(255,205,95,.95),9.3vw 0 7px 2px rgba(255,205,95,.95),15.5vw 0 7px 2px rgba(255,205,95,.95),21.8vw 0 7px 2px rgba(255,205,95,.95),28.1vw 0 7px 2px rgba(255,205,95,.95),34.3vw 0 7px 2px rgba(255,205,95,.95),40.6vw 0 7px 2px rgba(255,205,95,.95),46.9vw 0 7px 2px rgba(255,205,95,.95),53.1vw 0 7px 2px rgba(255,205,95,.95),59.4vw 0 7px 2px rgba(255,205,95,.95),65.7vw 0 7px 2px rgba(255,205,95,.95),71.9vw 0 7px 2px rgba(255,205,95,.95),78.2vw 0 7px 2px rgba(255,205,95,.95),84.5vw 0 7px 2px rgba(255,205,95,.95),90.7vw 0 7px 2px rgba(255,205,95,.95),97.0vw 0 7px 2px rgba(255,205,95,.95); animation: twinkle 3.1s ease-in-out infinite alternate; }
  .rise { position: fixed; left: 0; right: 0; bottom: 0; height: 0; pointer-events: none; z-index: 0; }
  .rise i { position: absolute; bottom: 4px; width: var(--s); height: var(--s); border-radius: 50%; opacity: 0;
    background: radial-gradient(circle, #FFF6D0 0%, #FFD36B 45%, rgba(255,190,70,0) 72%);
    box-shadow: 0 0 10px 3px rgba(255,205,95,0.65);
    animation: riseUp var(--d) linear var(--dl) infinite; }
  @keyframes riseUp {
    0%   { opacity: 0;   transform: translate(0, 0) scale(0.6); }
    10%  { opacity: 0.95; }
    75%  { opacity: 0.6; }
    100% { opacity: 0;   transform: translate(var(--dx), -100vh) scale(1.1); }
  }
  .page { width: 100%; max-width: 400px; position: relative; z-index: 1; }
  .hidden { display: none !important; }
  .muted { color: var(--ink-soft); font-size: 0.85rem; }

  /* Guest panel */
  .wrap { display: flex; flex-direction: column; align-items: center; }
  .panel {
    width: 100%;
    background: var(--card);
    border: 1px solid rgba(212,166,87,0.5);
    border-radius: 18px;
    box-shadow: 0 0 0 1px rgba(194,49,143,0.08), 0 22px 50px -20px rgba(194,49,143,0.45), 0 10px 26px -14px rgba(212,166,87,0.35);
  }
  .panel-inner { padding: 36px 30px; }
  .monogram {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 1.6rem;
    line-height: 1.2;
    letter-spacing: 0.08em;
    color: var(--gold);
    margin-bottom: 6px;
  }
  .disco-mark {
    display: block;
    margin: 2px auto 14px;
    filter: drop-shadow(0 6px 14px rgba(194,49,143,0.35));
  }
  .event-title {
    font-family: 'Great Vibes', 'Snell Roundhand', 'Brush Script MT', cursive;
    font-weight: 400;
    font-size: clamp(2.6rem, 11.5vw, 3.3rem);
    letter-spacing: 0.01em;
    line-height: 1.25;
    padding: 0.04em 0.12em 0.22em;
    text-align: center;
    background: linear-gradient(90deg, var(--accent-dark), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--ink-soft);
    font-size: 1.2rem;
    margin-top: 2px;
    margin-bottom: 24px;
    text-align: center;
  }

  #searchInput { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; letter-spacing: 0.01em; font-size: 1.3rem; }

  input[type=text], input[type=password], textarea {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--line);
    border-radius: 9px;
    font-size: 1rem;
    font-family: inherit;
    background: #fff;
    color: var(--ink);
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  .match-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .match-item {
    padding: 13px 14px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 9px;
    font-family: inherit;
    font-size: 1rem;
    text-align: left;
    cursor: pointer;
    color: var(--ink);
  }
  .match-item:hover { border-color: var(--accent); }

  .not-found { margin-top: 14px; font-size: 0.9rem; color: var(--ink-soft); line-height: 1.55; }

  .reveal-block {
    text-align: center;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .reveal-block.show { opacity: 1; transform: translateY(0); }
  .reveal-divider { height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 2px 0 24px; }
  .reveal-name { font-family: 'Great Vibes', 'Snell Roundhand', 'Brush Script MT', cursive; font-weight: 400; font-size: 2.1rem; line-height: 1.25; color: var(--accent-dark); }
  .seat-label { font-family: 'Unbounded', sans-serif; font-weight: 500; letter-spacing: 0.02em; color: var(--ink-soft); font-size: 0.88rem; margin-top: 16px; }
  .tablemates { margin-bottom: 20px; }
  .tablemates-label { font-family: 'Unbounded', sans-serif; font-weight: 500; letter-spacing: 0.02em; color: var(--ink-soft); font-size: 0.8rem; margin-bottom: 6px; }
  .tablemates-list { color: var(--ink); font-size: 0.95rem; line-height: 1.5; display: flex; flex-direction: column; gap: 4px; }
  .seat-number {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(2.4rem, 12vw, 3.6rem);
    color: var(--accent-dark);
    line-height: 1.1;
    margin: 2px 0 22px;
    word-break: break-word;
  }

  .link-btn {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 0.88rem;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .link-btn.danger { color: var(--danger); }
  .link-btn + .link-btn { margin-left: 14px; }
  .link-btn:disabled { opacity: 0.5; cursor: default; }

  .footer-link {
    margin-top: 24px;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 0.8rem;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

<div class="sparkles glow" aria-hidden="true"></div>
<div class="sparkles mix" aria-hidden="true"></div>

(function() {
  var $ = function(id) { return document.getElementById(id); };
  var normalize = function(s) { return (s || '').trim().toLowerCase().replace(/\s+/g, ' '); };
  var escapeHtml = function(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

  var guests = GUESTS.map(function(g, i) { return { id: 'g' + i, name: g.name, seat: g.seat }; });
  var nameCount = {};
  guests.forEach(function(g) { var k = normalize(g.name); nameCount[k] = (nameCount[k] || 0) + 1; });

  $('eventTitle').textContent = EVENT_TITLE;
  $('monogramText').textContent = MONOGRAM;
  document.title = EVENT_TITLE;

  function onSearchInput() {
    var nq = normalize($('searchInput').value);
    $('notFound').classList.add('hidden');
    if (!nq) { $('matchList').innerHTML = ''; return; }

    // Jump straight to the result only when exactly one guest has this name.
    var exacts = guests.filter(function(g) { return normalize(g.name) === nq; });
    if (exacts.length === 1) { doReveal(exacts[0]); return; }

    // Show every name that STARTS with what was typed (A -> all the A names), A to Z.
    // Only if nobody starts with it, fall back to a later word (surname), then to any part of a name.
    var byName = function(a, b) { return normalize(a.name) < normalize(b.name) ? -1 : (normalize(a.name) > normalize(b.name) ? 1 : 0); };
    var matches = guests.filter(function(g) { return normalize(g.name).indexOf(nq) === 0; }).sort(byName);
    if (matches.length === 0) {
      matches = guests.filter(function(g) { return (' ' + normalize(g.name)).indexOf(' ' + nq) !== -1; }).sort(byName);
    }
    if (matches.length === 0) {
      matches = guests.filter(function(g) { return normalize(g.name).indexOf(nq) !== -1; }).sort(byName);
    }
    $('matchList').innerHTML = matches.map(function(g) {
      var dup = nameCount[normalize(g.name)] > 1;
      return '<button class="match-item" data-id="' + g.id + '">' + escapeHtml(g.name) +
        (dup ? ' <span class="muted">(' + escapeHtml(g.seat) + ')</span>' : '') + '</button>';
    }).join('');
    $('notFound').classList.toggle('hidden', matches.length > 0);
    Array.prototype.forEach.call($('matchList').querySelectorAll('.match-item'), function(btn) {
      btn.addEventListener('click', function() {
        var g = guests.filter(function(x) { return x.id === btn.dataset.id; })[0];
        if (g) doReveal(g);
      });
    });
  }

  function doReveal(g) {
    $('subtitle').classList.add('hidden');
    $('searchStage').classList.add('hidden');
    $('revealName').textContent = g.name;
    $('revealSeat').textContent = g.seat;

    var others = guests.filter(function(x) { return x.id !== g.id && normalize(x.seat) === normalize(g.seat); })
                       .map(function(x) { return x.name; });
    if (others.length > 0) {
      $('tablemateNames').innerHTML = others.map(function(n) { return '<div>' + escapeHtml(n) + '</div>'; }).join('');
      $('tablemates').classList.remove('hidden');
    } else {
      $('tablemates').classList.add('hidden');
    }

    $('revealBlock').classList.remove('hidden');
    requestAnimationFrame(function() { $('revealBlock').classList.add('show'); });
  }

  function resetSearch() {
    $('searchInput').value = '';
    $('matchList').innerHTML = '';
    $('notFound').classList.add('hidden');
    $('revealBlock').classList.remove('show');
    $('revealBlock').classList.add('hidden');
    $('subtitle').classList.remove('hidden');
    $('searchStage').classList.remove('hidden');
    $('searchInput').focus();
  }

  $('searchInput').addEventListener('input', onSearchInput);
  $('searchAgainBtn').addEventListener('click', resetSearch);
})();
</script>
